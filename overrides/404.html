<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Seite wird weitergeleitet...</title>
  <script>
    (function() {
      var path = window.location.pathname;
      var targetUrl;

      // 1. Fall: Alter Link mit '/schachwelzheim/' -> Auf neue Unterseite umleiten
      if (path.startsWith('/schachwelzheim/')) {
        var newPath = path.replace(/^\/schachwelzheim/, '');
        targetUrl = window.location.origin + newPath + window.location.search + window.location.hash;
      } 
      // 2. Fall: Seite existiert komplett nicht -> Auf Startseite umleiten
      else {
        targetUrl = window.location.origin + '/';
      }

      // Sofortige Weiterleitung
      window.location.replace(targetUrl);
    })();
  </script>
</head>
<body>
  <h1>Seite nicht gefunden</h1>
  <p>Sie werden automatisch weitergeleitet...</p>
  <p>Falls die Weiterleitung nicht funktioniert, klicken Sie bitte <a id="redirect-link" href="/">hier</a>.</p>

  <script>
    // Fallback-Link für Browser ohne Aktiviertes JavaScript
    var path = window.location.pathname;
    var fallbackLink = document.getElementById('redirect-link');
    
    if (path.startsWith('/schachwelzheim/')) {
      fallbackLink.href = window.location.origin + path.replace(/^\/schachwelzheim/, '');
    } else {
      fallbackLink.href = window.location.origin + '/';
    }
  </script>
</body>
</html>
